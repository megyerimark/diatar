<div class="viewer"><header class="viewer-header"><a [routerLink]="classroom?'/classroom':'/library'" class="viewer-back"><app-icon name="back"/>Vissza</a><div><strong>{{item()?.title||'Prezentáció'}}</strong><small>Böngészős PDF-vetítés</small></div><div class="viewer-tools">@if(allowDownload()){<button class="button viewer-button" (click)="download()" [disabled]="!item()"><app-icon name="download"/><span>Eredeti letöltése</span></button>}<button class="icon-button" (click)="full()" aria-label="Teljes képernyő"><app-icon name="full"/></button></div></header><main class="viewer-stage" #stage><canvas #pdfCanvas [class.hidden]="!!error()" [attr.aria-label]="'Prezentáció '+page()+'. diája'"></canvas>@if(busy()){<div class="viewer-loading"><span class="spinner light"></span>Dia betöltése…</div>}@if(error()){<div class="viewer-error"><app-icon name="info"/><h2>{{error()}}</h2><a [routerLink]="classroom?'/classroom':'/library'" class="button light">Vissza az anyagokhoz</a></div>}</main><footer class="viewer-footer"><span><app-icon name="monitor"/><span>A nyílbillentyűkkel is lapozhatsz</span></span><div class="slide-navigation"><button class="icon-button" (click)="go(-1)" [disabled]="page()<=1||!doc" aria-label="Előző dia"><app-icon name="back"/></button><strong>{{page()}} <span>/ {{total()||'—'}}</span></strong><button class="icon-button" (click)="go(1)" [disabled]="page()>=total()||!doc" aria-label="Következő dia"><app-icon name="arrow"/></button></div><span class="viewer-brand">Diatár.</span></footer></div>
